<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Replaced by `flutter build web --base-href` (e.g. /hello-rust/ on GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FitPlan — บันทึกการออกกำลังกาย พร้อมจัดโปรแกรมเวทรายสัปดาห์อัตโนมัติ (Full / Mid / Home gym) อ้างอิงงานวิจัยล่าสุด ใช้ผ่านเว็บได้ทันที">
  <meta name="theme-color" content="#0F8B6C">
  <meta name="color-scheme" content="light dark">

  <!-- iOS / iPadOS home-screen web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitPlan">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>FitPlan — บันทึกการออกกำลังกาย</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F6; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      color: #1B2B26; background: #F4F7F6; z-index: 10;
      transition: opacity .25s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .name { font-size: 22px; font-weight: 700; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #D5E4DF; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0F8B6C;
      border-radius: 2px; animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #0F1513; color: #E3EEEA; }
      #splash .bar { background: #24332E; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">FitPlan</div>
    <div class="bar" role="progressbar" aria-label="กำลังโหลด"></div>
  </div>
  <noscript>กรุณาเปิดใช้งาน JavaScript เพื่อใช้ FitPlan</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
